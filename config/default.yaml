# Semua angka yang menentukan perilaku bot ada di file ini.
# Kode tidak boleh menyimpan nilai ini secara hardcode.
# Nama field yang berakhiran _fraction atau _rate adalah pecahan, bukan persen:
# 0.001 berarti 0,1 persen.

exchange:
  symbol: BTC/USDT
  timeframe: 1h
  recv_window_ms: 5000
  # Selisih jam lokal dan jam server yang masih ditoleransi saat start.
  # Lebih dari ini bot berhenti dan menyebut angka drift-nya.
  max_time_drift_ms: 1000
  # Jumlah sampel pengukuran jam saat connect, setelah satu panggilan pemanasan yang dibuang
  # (resolusi DNS dan jabat tangan TLS membuat panggilan pertama paling lambat). Sampel dengan
  # rtt terkecil yang dipakai: ketidakpastian estimasinya sekitar rtt/2.
  time_sync_samples: 5
  rate_limit: true
  retry:
    max_attempts: 5
    base_delay_seconds: 1.0
    max_delay_seconds: 30.0
  # Venue develop: Binance Spot Testnet, uang palsu. Hanya dipakai mode testnet.
  testnet:
    id: binance
    market_data_url: ""
  # Venue live: Tokocrypto (berizin OJK, tidak punya testnet). Dipakai mode live,
  # dan sebagai sumber harga mode paper supaya perilaku venue terlihat sebelum uang asli masuk.
  # Binance mainnet bukan lagi target karena api.binance.com diblokir ISP.
  live:
    id: tokocrypto
    # Host data pasar RESMI Tokocrypto untuk simbol jenis MBX (type 1), dari dokumentasi API mereka.
    # ccxt 4.5.78 merutekan ticker, OHLCV, order book, dan trades ke api.binance.com, yang
    # diblokir ISP dan bukan host resmi Tokocrypto. Endpoint akun dan order tetap www.tokocrypto.com.
    market_data_url: "https://www.tokocrypto.site/api/v3"

data:
  cache_dir: data
  history_start: "2025-09-01"
  # Gap lebih panjang dari ini (dalam jumlah bar) dianggap data rusak, bukan downtime exchange.
  max_gap_bars: 6

strategy:
  name: ema_cross
  fast_period: 20
  slow_period: 50
  # Strategi hanya membaca slow_period x lookback_multiplier bar terakhir, dan FLAT sebelum
  # bar sebanyak itu tersedia. Jendela tetap ini yang membuat sinyal backtest dan live identik
  # untuk bar yang sama. Bobot EMA yang terbuang di luar jendela sekitar e^(-2 x multiplier).
  lookback_multiplier: 5

risk:
  # Ukuran posisi sebagai pecahan dari equity saat ini.
  position_fraction: 0.10
  # Batas atas nilai satu posisi sebagai pecahan equity.
  max_position_fraction: 0.25
  # Rugi harian maksimum, dihitung dari equity awal hari (UTC), termasuk unrealized.
  daily_loss_limit_fraction: 0.03
  # Lapis 1: stop loss dan take profit sisi bot, sebagai pecahan dari harga masuk.
  stop_loss_fraction: 0.02
  take_profit_fraction: 0.04
  # Lapis 2 (tahap 8): stop order di exchange, jaraknya = stop_loss_fraction * multiplier.
  # Harus lebih lebar dari lapis 1. Normalnya tidak pernah kena; kena hanya kalau bot sudah mati.
  exchange_stop_multiplier: 2.0
  # Lapis 2: harga limit dipasang 0,5% di bawah harga stop supaya terisi saat stop terpicu.
  exchange_stop_limit_offset_fraction: 0.005
  # Proteksi runaway loop.
  max_orders_per_minute: 5
  # Gagal koneksi beruntun sebelum kill switch.
  max_consecutive_failures: 5
  # Kill switch manual: kalau file ini ada di root project, bot berhenti.
  stop_file: STOP
  # Apakah posisi yang sedang dipegang dijual saat kill switch terpicu. Diputus per pemicu.
  flatten_on:
    daily_loss: true
    runaway_orders: false
    connection_failures: false
    stop_file: false

costs:
  # Venue live: Tokocrypto, pasangan USDT. Sumber: artikel resmi "Informasi Biaya Transaksi
  # di Tokocrypto" dan "Aturan Perdagangan Tokocrypto" bagian 7.1, berlaku sejak 18 Juni 2026.
  # Tiga komponen pertama dijumlahkan per sisi: 0,15% + 0,21% + 0,0444% = 0,4044%.
  # Ini angka realistis dari exchange, bukan pesimistis. Yang pesimistis adalah --stress.
  #
  # Nilai lama, asumsi Binance spot, TIDAK BERLAKU LAGI dan backtest yang memakainya tidak sah:
  #   taker_fee_rate 0.001, tanpa pajak, tanpa biaya bursa, slippage_rate 0.001.
  taker_fee_rate: 0.0015
  # PPh 22 final 0,21%, dipungut Tokocrypto di sumber. Untuk pasangan USDT/kripto dikenakan
  # di kedua sisi (beli dan jual). Dasar: PMK 50/2025, berlaku 1 Agustus 2025.
  tax_rate: 0.0021
  # Biaya bursa dan kliring (ICEx fee) 0,0444% untuk pasangan USDT/kripto, berlaku 18 Juni 2026.
  # Komponen yang paling sering berubah. Riwayat pasangan USDT: 0,0444% (sampai Feb 2026)
  # -> 0,0222% (1 Mar 2026, CFX) -> 0,0444% (18 Jun 2026, ICEx). Pasangan IDR: 0,0222% -> 0,0111%
  # -> 0,0222% pada tanggal yang sama. Cek ulang setiap kali ada pengumuman biaya.
  exchange_fee_rate: 0.000444
  # Dinaikkan dari asumsi Binance 0,1%. Buku BTC/USDT di Tokocrypto adalah buku Binance yang
  # dibagi, tapi venue berbeda dan eksekusinya belum diamati, jadi diberi ruang lebih.
  slippage_rate: 0.0015
  # backtest --stress mengalikan taker_fee_rate, exchange_fee_rate, dan slippage_rate.
  # tax_rate tetap: pajak adalah angka pasti dari peraturan, bukan asumsi yang bisa meleset.
  stress_multiplier: 2.0

backtest:
  initial_equity: 1000.0
  # Jumlah bar per tahun untuk anualisasi Sharpe. 8760 untuk timeframe 1h.
  bars_per_year: 8760

live:
  loop_interval_seconds: 30
  # Bar terakhir yang umurnya melebihi timeframe + toleransi ini dianggap stale.
  # Iterasi dilewati dan dicatat di log; strategi tidak memutuskan apa pun.
  stale_bar_tolerance_seconds: 120
  # {mode_dir} diganti "" di paper dan "live/" atau "testnet/" di mode berkunci: catatan paper
  # tetap di tempat lama, catatan uang asli terpisah dan tidak pernah tercampur dengan simulasi.
  journal_path: state/{mode_dir}orders.jsonl
  state_path: state/{mode_dir}risk_state.json
  # Catatan posisi yang dipegang (harga masuk, stop, target), supaya stop lapis 1 selamat restart.
  position_path: state/{mode_dir}position.json
  # Akun paper: saldo, order, dan trade simulasi. Saldo awal = backtest.initial_equity (quote).
  paper_account_path: state/{mode_dir}paper_account.json
  trades_csv: trades/{mode_dir}trades.csv
  # compare-paper: bias satu arah dinyatakan kalau, dari minimal bias_min_trades pasangan fill,
  # pangsa yang merugikan (atau menguntungkan) mencapai bias_adverse_share.
  bias_min_trades: 5
  bias_adverse_share: 0.75
  # paper-checklist: minimal fill yang tertelusuri dari niat di jurnal sampai baris ledger.
  checklist_min_fills: 4
  # Tahap 8. Mode live menolak jalan selama enabled false, walau TRADING_MODE=live dan flag
  # --i-know-what-im-doing diberikan. Ubah ke true hanya setelah paper run selesai (paper-checklist
  # OK), preflight lulus, dan Anda menyatakan siap.
  enabled: false
  # Tanggal terakhir Anda memeriksa halaman API Management Tokocrypto: izin withdrawal MATI,
  # pembatasan IP aktif kalau tersedia. Kosong berarti belum pernah; preflight menolak.
  api_key_verified_date: ""
  max_key_age_days: 90
  # Order pertama di live dipaksa ke ukuran minimum exchange. Naik ke ukuran normal hanya lewat
  # `tradebot live-size --normal`, yang ditolak sebelum sekian siklus masuk-keluar selesai.
  min_cycles_before_normal: 3
  stage_path: state/{mode_dir}live_stage.json

logging:
  # logs/ di paper, logs/live/ di live: log uang asli tidak bercampur dengan log simulasi.
  dir: logs/{mode_dir}
  level: INFO
