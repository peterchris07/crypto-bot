[project]
name = "tradebot"
version = "0.1.0"
description = "Bot trading crypto spot Binance dengan mode paper, testnet, dan live"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.4,<5",
    "pandas>=2.2,<3",
    "pyarrow>=17,<21",
    "numpy>=1.26,<3",
    "pyyaml>=6.0,<7",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
tradebot = "tradebot.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.6,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradebot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "testnet: butuh kunci Binance Spot Testnet di .env; dilewati kalau tidak ada",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
